    class SoundEffectManager {
      constructor() {
        this.ctx = null;
        this.isMuted = localStorage.getItem("cognitype_muted") === "true";
      }
      init() {
        if (!this.ctx && typeof window !== "undefined") {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
      }
      setMuted(muted) {
        this.isMuted = muted;
        localStorage.setItem("cognitype_muted", muted ? "true" : "false");
      }
      triggerHaptic(ms = 15) {
        if (typeof navigator !== "undefined" && navigator.vibrate) {
          try { navigator.vibrate(ms); } catch (e) {}
        }
      }
      playPop() {
        if (this.isMuted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sine";
          const now = this.ctx.currentTime;
          osc.frequency.setValueAtTime(450, now);
          osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.05);
          this.triggerHaptic(12);
        } catch (e) {}
      }
      playChime() {
        if (this.isMuted) return;
        this.init();
        if (!this.ctx) return;
        try {
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const now = this.ctx.currentTime + idx * 0.08;
            osc.type = "triangle";
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.4);
          });
          this.triggerHaptic(30);
        } catch (e) {}
      }
    }

    };

    function App() {
      const [activeTab, setActiveTab] = useState("quiz");
      const [apiKey, setApiKey] = useState(() => localStorage.getItem("cognitype_gemini_api_key") || "");
      const [keySavedBadge, setKeySavedBadge] = useState(false);
      const [quotaState, setQuotaState] = useState(() => {
        const currentMonth = "2026-11";
        const saved = localStorage.getItem("cognitype_quota_guard");
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (parsed.month === currentMonth) return parsed;
          } catch (e) {}
        }
        return { month: currentMonth, count: 0, limit: 1000, isLocked: false };
      });

      const [isMuted, setIsMuted] = useState(sound.isMuted);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [answers, setAnswers] = useState({});
      const [answerTimes, setAnswerTimes] = useState({});
      const qStartTimeRef = useRef(Date.now());

      // 戰帖對手（URL 攜帶狀態）
      const [challengerType, setChallengerType] = useState(null);

      // 三階矩陣膠著題隊列
      const [isBorderlineMode, setIsBorderlineMode] = useState(false);
      const [borderlineQuestions, setBorderlineQuestions] = useState([]);
      const [currentDilemmaIdx, setCurrentDilemmaIdx] = useState(0);
      const [dilemmaAnswers, setDilemmaAnswers] = useState({});

      const [isScenarioMode, setIsScenarioMode] = useState(false);
      const [scenarioOS, setScenarioOS] = useState("");
      const [scenarioPublic, setScenarioPublic] = useState("");

      const [result, setResult] = useState(null);
      const [reportTone, setReportTone] = useState("warm");
      const [aiReport, setAiReport] = useState(null);
      const [isAiLoading, setIsAiLoading] = useState(false);
      const [aiErrorMsg, setAiErrorMsg] = useState("");
      const [copiedToast, setCopiedToast] = useState(false);

      const [testHistory, setTestHistory] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem("cognitype_history") || "[]");
        } catch (e) {
          return [];
        }
      });

      const [compatSelf, setCompatSelf] = useState("INTJ");
      const [compatOther, setCompatOther] = useState("ENFP");
      const [compatRelation, setCompatRelation] = useState("職場隊友");
      const [compatResult, setCompatResult] = useState(null);
      const [compatLoading, setCompatLoading] = useState(false);

      const [roleplayTarget, setRoleplayTarget] = useState("ESTJ");
      const [roleplaySpeech, setRoleplaySpeech] = useState("");
      const [roleplayReply, setRoleplayReply] = useState(null);
      const [roleplayLoading, setRoleplayLoading] = useState(false);

      const canvasRef = useRef(null);

      // 初始化：解析 URL 戰帖參數
      useEffect(() => {
        try {
          const params = new URLSearchParams(window.location.search);
          const ch = params.get("challenger");
          if (ch && ARCHETYPES[ch.toUpperCase()]) {
            setChallengerType(ch.toUpperCase());
            setCompatOther(ch.toUpperCase());
          }
        } catch (e) {}
      }, []);

      // 換題時重置作答計時器
      useEffect(() => {
        qStartTimeRef.current = Date.now();
      }, [currentIndex, isBorderlineMode, currentDilemmaIdx]);

      const handleKeyChange = (val) => {
        const trimmed = val.trim();
        setApiKey(trimmed);
        localStorage.setItem("cognitype_gemini_api_key", trimmed);
        setKeySavedBadge(true);
        setTimeout(() => setKeySavedBadge(false), 2000);
      };

      const updateQuota = (increment = 1, triggerLock = false) => {
        setQuotaState(prev => {
          const newCount = prev.count + increment;
          const isLocked = triggerLock || newCount >= prev.limit;
          const updated = { ...prev, count: newCount, isLocked };
          localStorage.setItem("cognitype_quota_guard", JSON.stringify(updated));
          return updated;
        });
      };

      const handleResetQuota = () => {
        const updated = { ...quotaState, count: 0, isLocked: false };
        setQuotaState(updated);
        localStorage.setItem("cognitype_quota_guard", JSON.stringify(updated));
        sound.playPop();
      };

      const toggleSound = () => {
        const next = !isMuted;
        setIsMuted(next);
        sound.setMuted(next);
      };

      // 記錄作答與時延（直覺度偵測）
      const handleAnswer = (val) => {
        sound.playPop();
        const latency = Math.round((Date.now() - qStartTimeRef.current) / 100) / 10; // 秒
        const q = QUESTIONS[currentIndex];
        const newAnswers = { ...answers, [q.id]: val };
        const newTimes = { ...answerTimes, [q.id]: latency };
        setAnswers(newAnswers);
        setAnswerTimes(newTimes);

        if (currentIndex < QUESTIONS.length - 1) {
          setCurrentIndex(prev => prev + 1);
        } else {
          evaluateBorderlineOrNext(newAnswers, newTimes);
        }
      };

      // 膠著維度判定（加入時延權重加權）
      const evaluateBorderlineOrNext = (ansMap, timesMap) => {
        const dims = {
          EI: { positive: 0, negative: 0 },
          SN: { positive: 0, negative: 0 },
          TF: { positive: 0, negative: 0 },
          JP: { positive: 0, negative: 0 }
        };

        QUESTIONS.forEach(q => {
          const score = ansMap[q.id];
          if (score === undefined) return;
          const lat = timesMap[q.id] || 4.0;
          // 時延加權：< 2.5s 直覺乘 1.15，> 7.5s 猶豫乘 0.85
          const weight = lat < 2.5 ? 1.15 : (lat > 7.5 ? 0.85 : 1.0);
          const diff = (score - 3) * weight;

          if (diff > 0) {
            if (q.target === q.dim[0]) dims[q.dim].positive += diff;
            else dims[q.dim].negative += diff;
          } else if (diff < 0) {
            const absVal = Math.abs(diff);
            if (q.target === q.dim[0]) dims[q.dim].negative += absVal;
            else dims[q.dim].positive += absVal;
          }
        });

        const borderlines = [];
        Object.keys(dims).forEach(dim => {
          const pos = dims[dim].positive;
          const neg = dims[dim].negative;
          const total = pos + neg;
          const posPct = total === 0 ? 50 : Math.round((pos / total) * 100);
          if (posPct >= 46 && posPct <= 54) borderlines.push(dim);
        });

        if (borderlines.length > 0) {
          const queued = [];
          borderlines.forEach(dim => {
            const qList = TRIANGULATION_BANK[dim];
            qList.forEach((item, subIdx) => {
              queued.push({
                dim,
                subIdx,
                totalSub: qList.length,
                ...item
              });
            });
          });
          setBorderlineQuestions(queued);
          setCurrentDilemmaIdx(0);
          setIsBorderlineMode(true);
        } else {
          setIsScenarioMode(true);
        }
      };

      const handleDilemmaSelect = (choiceCode) => {
        sound.playPop();
        const currentQ = borderlineQuestions[currentDilemmaIdx];
        const newDilemmas = {
          ...dilemmaAnswers,
          [`${currentQ.dim}_${currentQ.subIdx}`]: {
            dim: currentQ.dim,
            choice: choiceCode
          }
        };
        setDilemmaAnswers(newDilemmas);

        if (currentDilemmaIdx < borderlineQuestions.length - 1) {
          setCurrentDilemmaIdx(prev => prev + 1);
        } else {
          setIsBorderlineMode(false);
          setIsScenarioMode(true);
        }
      };

      // 計算最終性格、榮格八維與信度評估
      const calculateFinalResult = () => {
        sound.playChime();
        const dimScores = {
          EI: { positive: 0, negative: 0 },
          SN: { positive: 0, negative: 0 },
          TF: { positive: 0, negative: 0 },
          JP: { positive: 0, negative: 0 }
        };

        let totalLatency = 0;
        let fastCount = 0;

        QUESTIONS.forEach(q => {
          const val = answers[q.id] || 3;
          const lat = answerTimes[q.id] || 4.0;
          totalLatency += lat;
          if (lat < 2.5) fastCount++;

          const weight = lat < 2.5 ? 1.15 : (lat > 7.5 ? 0.85 : 1.0);
          const diff = (val - 3) * weight;

          if (diff > 0) {
            if (q.target === q.dim[0]) dimScores[q.dim].positive += diff;
            else dimScores[q.dim].negative += diff;
          } else if (diff < 0) {
            const abs = Math.abs(diff);
            if (q.target === q.dim[0]) dimScores[q.dim].negative += abs;
            else dimScores[q.dim].positive += abs;
          }
        });

        // 3 題連續定錨計分（每題強烈定錨 ±2.5 分）
        Object.values(dilemmaAnswers).forEach(item => {
          const { dim, choice } = item;
          if (choice === dim[0]) {
            dimScores[dim].positive += 2.5;
          } else {
            dimScores[dim].negative += 2.5;
          }
        });

        const traits = {};
        let mbtiCode = "";

        const processDim = (key, leftLetter, rightLetter) => {
          const pos = dimScores[key].positive;
          const neg = dimScores[key].negative;
          const sum = pos + neg;
          let leftPct = sum === 0 ? 50 : Math.round((pos / sum) * 100);
          let rightPct = 100 - leftPct;

          const winner = leftPct >= rightPct ? leftLetter : rightLetter;
          mbtiCode += winner;
          traits[key] = {
            winner,
            leftLetter,
            rightLetter,
            leftPct,
            rightPct,
            winnerPct: winner === leftLetter ? leftPct : rightPct,
            wasBorderline: borderlineQuestions.some(bq => bq.dim === key)
          };
        };

        processDim("EI", "E", "I");
        processDim("SN", "S", "N");
        processDim("TF", "T", "F");
        processDim("JP", "J", "P");

        // 一致性信度 (Lie Scale) 檢驗
        let contradictionDeltas = 0;
        CONTRADICTION_PAIRS.forEach(pair => {
          const vA = answers[pair.qA] || 3;
          const vB = answers[pair.qB] || 3;
          // 理論上反向題 vA + vB 應該接近 6，若偏離超過 2.5 則計為矛盾
          const deviation = Math.abs((vA + vB) - 6);
          if (deviation >= 2) contradictionDeltas += deviation;
        });

        const rawReliability = Math.max(68, Math.min(99, 100 - contradictionDeltas * 4));
        const avgSpeed = (totalLatency / QUESTIONS.length).toFixed(1);
        const intuitivePct = Math.round((fastCount / QUESTIONS.length) * 100);

        const info = ARCHETYPES[mbtiCode] || ARCHETYPES["INTJ"];
        const cognitive = COGNITIVE_DATA[mbtiCode] || COGNITIVE_DATA["INTJ"];

        const finalRes = {
          code: mbtiCode,
          info,
          cognitive,
          traits,
          reliability: {
            score: rawReliability,
            avgSpeed,
            intuitivePct,
            status: rawReliability >= 88 ? "極高信度 (本能反射)" : (rawReliability >= 78 ? "優良信度 (微度審查)" : "輕度自我防禦偏誤")
          },
          scenarioOS,
          scenarioPublic,
          timestamp: new Date().toISOString()
        };

        setResult(finalRes);
        setCompatSelf(mbtiCode);
        setIsScenarioMode(false);
        setActiveTab("result");

        const newHistory = [
          {
            id: "test_" + Date.now(),
            date: new Date().toLocaleDateString("zh-TW", { year: "numeric", month: "2-digit", day: "2-digit" }),
            type: mbtiCode,
            title: info.title,
            avatar: info.avatar,
            traits
          },
          ...testHistory.slice(0, 9)
        ];
        setTestHistory(newHistory);
        localStorage.setItem("cognitype_history", JSON.stringify(newHistory));

        setTimeout(() => drawShareCard(finalRes), 250);
      };

      // 繪製 9:16 高畫質圖卡（內建動態 QR Code）
      const drawShareCard = (res) => {
        const canvas = canvasRef.current;
        if (!canvas || !res) return;
        const ctx = canvas.getContext("2d");
        const width = 1080;
        const height = 1920;
        canvas.width = width;
        canvas.height = height;

        // 背景深色漸層
        const bgGrad = ctx.createLinearGradient(0, 0, width, height);
        bgGrad.addColorStop(0, "#090d16");
        bgGrad.addColorStop(0.5, "#0f172a");
        bgGrad.addColorStop(1, "#030712");
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, width, height);

        // 柔和光暈
        const glow = ctx.createRadialGradient(540, 420, 50, 540, 420, 550);
        glow.addColorStop(0, "rgba(99, 102, 241, 0.25)");
        glow.addColorStop(1, "rgba(99, 102, 241, 0)");
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, width, height);

        // 頂部認證標題
        ctx.textAlign = "center";
        ctx.fillStyle = "#818cf8";
        ctx.font = "bold 38px sans-serif";
        ctx.fillText("COGNITYPE PRO 60題深度常模認證", 540, 140);

        // 人格頭像與代碼
        ctx.font = "130px sans-serif";
        ctx.fillText(res.info.avatar, 540, 310);

        ctx.fillStyle = "#ffffff";
        ctx.font = "900 110px sans-serif";
        ctx.fillText(res.code, 540, 440);

        ctx.fillStyle = "#38bdf8";
        ctx.font = "bold 44px sans-serif";
        ctx.fillText(res.info.title, 540, 510);

        // 信度標籤
        ctx.fillStyle = "#10b981";
        ctx.font = "bold 28px sans-serif";
        ctx.fillText(`🛡️ 作答信度 ${res.reliability.score}% · ${res.reliability.status}`, 540, 565);

        // 四維度光譜條
        const barYStart = 640;
        const barSpacing = 110;
        const dims = [
          { key: "EI", leftName: "外向 E", rightName: "內向 I" },
          { key: "SN", leftName: "實感 S", rightName: "直覺 N" },
          { key: "TF", leftName: "理性 T", rightName: "感性 F" },
          { key: "JP", leftName: "計畫 J", rightName: "隨性 P" }
        ];

        dims.forEach((d, idx) => {
          const t = res.traits[d.key];
          const y = barYStart + idx * barSpacing;

          ctx.textAlign = "left";
          ctx.fillStyle = t.winner === t.leftLetter ? "#38bdf8" : "#64748b";
          ctx.font = "bold 28px sans-serif";
          ctx.fillText(`${d.leftName} ${t.leftPct}%`, 140, y - 16);

          ctx.textAlign = "right";
          ctx.fillStyle = t.winner === t.rightLetter ? "#c084fc" : "#64748b";
          ctx.fillText(`${t.rightPct}% ${d.rightName}`, 940, y - 16);

          ctx.fillStyle = "#1e293b";
          ctx.beginPath();
          ctx.roundRect(140, y, 800, 22, 11);
          ctx.fill();

          const barGrad = ctx.createLinearGradient(140, 0, 940, 0);
          barGrad.addColorStop(0, "#38bdf8");
          barGrad.addColorStop(1, "#c084fc");
          ctx.fillStyle = barGrad;
          ctx.beginPath();
          ctx.roundRect(140, y, Math.max(30, (t.leftPct / 100) * 800), 22, 11);
          ctx.fill();
        });

        // 榮格八維與壓力暴走卡片
        const cardY = 1120;
        ctx.fillStyle = "rgba(30, 41, 59, 0.85)";
        ctx.beginPath();
        ctx.roundRect(100, cardY, 880, 530, 32);
        ctx.fill();
        ctx.strokeStyle = "rgba(148, 163, 184, 0.25)";
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.textAlign = "left";
        ctx.fillStyle = "#facc15";
        ctx.font = "bold 34px sans-serif";
        ctx.fillText("🧠 榮格八維認知功能堆疊", 140, cardY + 65);

        ctx.fillStyle = "#e2e8f0";
        ctx.font = "26px sans-serif";
        res.cognitive.stack.forEach((st, sIdx) => {
          const colX = sIdx % 2 === 0 ? 140 : 540;
          const rowY = cardY + 125 + Math.floor(sIdx / 2) * 55;
          ctx.fillText(`• ${st}`, colX, rowY);
        });

        ctx.fillStyle = "#f43f5e";
        ctx.font = "bold 30px sans-serif";
        ctx.fillText("⚠️ 劣勢功能極限暴走預警 (Grip Stress)", 140, cardY + 280);

        ctx.fillStyle = "#cbd5e1";
        ctx.font = "24px sans-serif";
        // 自動換行
        const wrapGrip = res.cognitive.grip;
        ctx.fillText(wrapGrip.slice(0, 24), 140, cardY + 335);
        ctx.fillText(wrapGrip.slice(24), 140, cardY + 375);

        ctx.fillStyle = "#38bdf8";
        ctx.font = "bold 28px sans-serif";
        ctx.fillText("🔧 原廠心智急救重啟：", 140, cardY + 440);
        ctx.fillStyle = "#94a3b8";
        ctx.font = "24px sans-serif";
        ctx.fillText(res.cognitive.reset, 140, cardY + 485);

        // 生成並繪製動態 QR Code（邀請好友挑戰）
        try {
          const qrDiv = document.getElementById("qrcode-hidden");
          qrDiv.innerHTML = "";
          const challengeUrl = `${window.location.origin}${window.location.pathname}?challenger=${res.code}`;
          
          if (typeof QRCode !== "undefined") {
            new QRCode(qrDiv, {
              text: challengeUrl,
              width: 140,
              height: 140,
              colorDark: "#030712",
              colorLight: "#ffffff",
              correctLevel: QRCode.CorrectLevel.M
            });

            setTimeout(() => {
              const qrImg = qrDiv.querySelector("img");
              if (qrImg && qrImg.src) {
                const img = new Image();
                img.onload = () => {
                  ctx.fillStyle = "#ffffff";
                  ctx.beginPath();
                  ctx.roundRect(830, 1690, 160, 160, 16);
                  ctx.fill();
                  ctx.drawImage(img, 840, 1700, 140, 140);

                  ctx.textAlign = "right";
                  ctx.fillStyle = "#facc15";
                  ctx.font = "bold 26px sans-serif";
                  ctx.fillText("掃描向我發起合盤挑戰 ➔", 810, 1780);
                };
                img.src = qrImg.src;
              }
            }, 100);
          }
        } catch (e) {}

        // 底部版權宣告
        ctx.textAlign = "left";
        ctx.fillStyle = "#64748b";
        ctx.font = "24px sans-serif";
        ctx.fillText("CogniType AI 3.8 常模深度校準 · 截圖分享至 IG Story / Threads", 140, 1830);
      };

      const handleDownloadCard = () => {
        sound.playPop();
        const canvas = canvasRef.current;
        if (!canvas) return;
        const url = canvas.toDataURL("image/png");
        const a = document.createElement("a");
        a.href = url;
        a.download = `CogniType_${result ? result.code : "MBTI"}_Report.png`;
        a.click();
      };

      // 複製好友戰帖 URL
      const handleCopyChallengeUrl = () => {
        sound.playPop();
        if (!result) return;
        const challengeUrl = `${window.location.origin}${window.location.pathname}?challenger=${result.code}`;
        navigator.clipboard.writeText(challengeUrl).then(() => {
          setCopiedToast(true);
          setTimeout(() => setCopiedToast(false), 2500);
        });
      };

      // 跳轉至好友即時合盤
      const handleGoChallengerCompat = () => {
        sound.playPop();
        if (challengerType) {
          setCompatSelf(result.code);
          setCompatOther(challengerType);
          setActiveTab("compatibility");
        }
      };

      // 支援自動重試與最新 gemini-3.8-flash 模型
      const callGeminiFlash = async (prompt, systemInstruction, retryCount = 0) => {
        if (quotaState.isLocked) throw new Error("QUOTA_CIRCUIT_BREAKER_ACTIVE");
        if (!apiKey) throw new Error("NO_API_KEY");

        const endpoint = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=" + apiKey;
        const payload = {
          contents: [{ role: "user", parts: [{ text: prompt }] }],
          generationConfig: { temperature: 0.7, responseMimeType: "application/json" }
        };
        if (systemInstruction) payload.systemInstruction = { parts: [{ text: systemInstruction }] };

        try {
          const response = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          if (response.status === 429) {
            updateQuota(0, true);
            throw new Error("HTTP_429_QUOTA_EXHAUSTED");
          }

          if ((response.status === 503 || !response.ok) && retryCount < 2) {
            const errJson = await response.json().catch(() => ({}));
            const msg = (errJson.error && errJson.error.message) || "";
            if (msg.includes("high demand") || response.status === 503) {
              await new Promise(res => setTimeout(res, 2000));
              return callGeminiFlash(prompt, systemInstruction, retryCount + 1);
            }

          if (!response.ok) {

                        onClick={() => { sound.playPop(); setReportTone("roast"); }}
                        className={"px-3.5 py-1.5 rounded-xl text-xs font-bold transition " + (reportTone === "roast" ? "bg-rose-500 text-white shadow" : "text-slate-400 hover:text-white")}
                      >
                        🌶️ 毒舌版
                      </button>
                    </div>
                  </div>

                  <div className="text-left bg-slate-950/70 p-5 sm:p-6 rounded-2xl border border-slate-800 text-slate-300 text-sm sm:text-base leading-relaxed">
                    {reportTone === "warm" ? result.info.warmBio : result.info.roastBio}
                  </div>
                </div>

                {/* 升級亮點 3：測驗防禦與信度儀表板 */}
                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-xl">
                  <h3 className="text-base font-bold text-emerald-400 mb-4 flex items-center space-x-2">
                    <span>🛡️ 作答真實信度檢驗（Lie & Consistency Scale）</span>
                  </h3>
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 text-xs sm:text-sm">
                    <div className="p-4 bg-slate-950 rounded-2xl border border-slate-800">
                      <span className="text-slate-400 block mb-1">邏輯一致性評分</span>
                      <span className="text-xl font-black text-emerald-400">{result.reliability.score}%</span>
                      <p className="text-[11px] text-slate-500 mt-1">{result.reliability.status}</p>
                    </div>
                    <div className="p-4 bg-slate-950 rounded-2xl border border-slate-800">
                      <span className="text-slate-400 block mb-1">平均作答時延</span>
                      <span className="text-xl font-black text-sky-400">{result.reliability.avgSpeed} 秒 / 題</span>
                      <p className="text-[11px] text-slate-500 mt-1">常態區間 2.5s ~ 6.0s</p>
                    </div>
                    <div className="p-4 bg-slate-950 rounded-2xl border border-slate-800">
                      <span className="text-slate-400 block mb-1">直覺本能作答率</span>
                      <span className="text-xl font-black text-indigo-400">{result.reliability.intuitivePct}%</span>
                      <p className="text-[11px] text-slate-500 mt-1">時延 &lt; 2.5s 無自我審查</p>
                    </div>
                  </div>
                </div>

                {/* 四大維度光譜 */}
                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-xl">
                  <h3 className="text-base font-bold text-white mb-6 flex items-center justify-between">
                    <span>📊 四大核心維度連續光譜</span>
                    <span className="text-xs text-indigo-400 font-normal">已完成時延與常模校準</span>
                  </h3>

                  <div className="space-y-6">
                    {[
                      { key: "EI", left: "外向 E", right: "內向 I" },
                      { key: "SN", left: "實感 S", right: "直覺 N" },
                      { key: "TF", left: "理性 T", right: "感性 F" },
                      { key: "JP", left: "計畫 J", right: "隨性 P" }
                    ].map(item => {
                      const t = result.traits[item.key];
                      return (
                        <div key={item.key}>
                          <div className="flex justify-between text-xs font-bold mb-2">
                            <span className={t.winner === t.leftLetter ? "text-sky-400" : "text-slate-500"}>
                              {item.left} ({t.leftPct}%)
                            </span>
                            <span className={t.winner === t.rightLetter ? "text-pink-400" : "text-slate-500"}>
                              ({t.rightPct}%) {item.right}
                            </span>
                          </div>
                          <div className="w-full bg-slate-950 h-3 rounded-full overflow-hidden flex p-0.5 border border-slate-800">
                            <div
                              className="bg-gradient-to-r from-sky-400 to-indigo-500 h-full rounded-full transition-all duration-500"
                              style={{ width: t.leftPct + "%" }}
                            />
                            <div
                              className="bg-gradient-to-r from-indigo-500 to-pink-500 h-full rounded-full transition-all duration-500"
                              style={{ width: t.rightPct + "%" }}
                            />
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* 升級亮點 1：榮格八維堆疊與壓力暴走預警 */}
                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-xl space-y-6">
                  <div>
                    <h3 className="text-base font-bold text-amber-400 flex items-center space-x-2">
                      <span>🧠 榮格八維認知功能堆疊 (Cognitive Functions)</span>
                    </h3>
                    <p className="text-xs text-slate-400 mt-1">揭示你底層思維的四重運作階層與能量流動脈絡</p>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs sm:text-sm">
                    {result.cognitive.stack.map((st, i) => (
                      <div key={i} className="p-3.5 bg-slate-950 rounded-2xl border border-slate-800 flex items-center space-x-3">
                        <span className="w-6 h-6 rounded-full bg-indigo-500/20 text-indigo-300 font-bold flex items-center justify-center text-xs">
                          {i + 1}
                        </span>
                        <span className="font-semibold text-slate-200">{st}</span>
                      </div>
                    ))}
                  </div>

                  <div className="p-4 bg-rose-950/30 border border-rose-500/30 rounded-2xl space-y-2">
                    <span className="text-xs font-bold text-rose-400 block">
                      ⚠️ 極端壓力下劣勢功能暴走預警 (Grip Stress)：
                    </span>
                    <p className="text-xs sm:text-sm text-rose-200 leading-relaxed font-medium">
                      {result.cognitive.grip}
                    </p>
                  </div>

                  <div className="p-4 bg-sky-950/30 border border-sky-500/30 rounded-2xl space-y-1.5">
                    <span className="text-xs font-bold text-sky-400 block">
                      🔧 原廠心智急救重啟指南：
                    </span>
                    <p className="text-xs sm:text-sm text-sky-200 leading-relaxed">
                      {result.cognitive.reset}
                    </p>
                  </div>
                </div>

                {/* AI 認知教練 */}
                <div className="bg-gradient-to-b from-slate-900 to-indigo-950/40 border border-indigo-500/30 rounded-3xl p-6 sm:p-8 shadow-xl">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                    <div>
                      <h3 className="text-lg font-bold text-white flex items-center space-x-2">
                        <span>✨ Gemini 3.8 Flash 認知教練</span>
                        <span className="text-xs px-2 py-0.5 bg-indigo-500/20 text-indigo-300 rounded-md">Live AI</span>
                      </h3>
                      <p className="text-xs text-slate-400 mt-1">結合 60 題精準光譜與真實情境 OS，深度剖析心理防禦機制與八維認知</p>
                    </div>

                    <button
                      onClick={generateAiReport}
                      disabled={isAiLoading || quotaState.isLocked}
                      className={"px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition shadow " + (
                        quotaState.isLocked
                          ? "bg-slate-800 text-slate-500 cursor-not-allowed"
                          : "bg-indigo-600 hover:bg-indigo-500 text-white"
                      )}
                    >
                      {isAiLoading ? "思考演算中..." : quotaState.isLocked ? "已達本月免費上限" : "生成專屬 AI 報告"}
                    </button>
                  </div>

                  {aiErrorMsg && (
                    <div className="mb-4 p-3 bg-amber-950/50 border border-amber-500/40 rounded-xl text-xs text-amber-200">
                      {aiErrorMsg}
                    </div>
                  )}

                  {aiReport && (
                    <div className="space-y-4 text-xs sm:text-sm">
                      <div className="p-4 bg-slate-950/80 rounded-2xl border border-indigo-500/20">
                        <span className="text-indigo-400 font-bold block mb-1">🎯 靈魂專屬超能稱號：</span>
                        <span className="text-base font-bold text-white">{aiReport.superpower_title}</span>
                      </div>
                      <div className="p-4 bg-slate-950/80 rounded-2xl border border-indigo-500/20 leading-relaxed text-slate-300">
                        <span className="text-pink-400 font-bold block mb-1">🎭 內心 OS 與公開發言防禦機制對比：</span>
                        {aiReport.cognitive_drift_analysis}
                      </div>
                      {aiReport.grip_stress_coaching && (
                        <div className="p-4 bg-slate-950/80 rounded-2xl border border-rose-500/20 leading-relaxed text-rose-200">
                          <span className="text-rose-400 font-bold block mb-1">⚡ 劣勢功能暴走脫困建議：</span>
                          {aiReport.grip_stress_coaching}
                        </div>
                      )}
                      <div className="p-4 bg-slate-950/80 rounded-2xl border border-indigo-500/20">
                        <span className="text-emerald-400 font-bold block mb-2">⚡ 3 項高槓桿個人成長習慣：</span>
                        <ul className="space-y-1 text-slate-300 list-disc list-inside">
                          {aiReport.high_leverage_habits && aiReport.high_leverage_habits.map((h, i) => <li key={i}>{h}</li>)}
                        </ul>
                      </div>
                    </div>
                  )}
                </div>

                {/* 升級亮點 2：9:16 IG Story 分享圖卡（內建 QR Code） */}
                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-xl text-center">
                  <h3 className="text-base font-bold text-white mb-1">📱 9:16 IG Story / Threads 高畫質分享圖卡</h3>
                  <p className="text-xs text-slate-400 mb-6">已自動嵌入專屬動態二維碼，好友掃描直接向你發起合盤對抗！</p>
                  <div className="flex justify-center mb-6">
                    <canvas
                      ref={canvasRef}
                      className="w-48 sm:w-60 rounded-2xl border border-slate-700 shadow-2xl"
                      style={{ aspectRatio: "9/16" }}
                    />
                  </div>
                  <button
                    onClick={handleDownloadCard}
                    className="w-full sm:w-auto px-8 py-3.5 bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 text-white font-bold rounded-2xl text-sm shadow-lg shadow-indigo-500/20 transition active:scale-95"
                  >
                    📥 一鍵無損下載 PNG 分享圖卡
                  </button>
                </div>
              </div>
            )}

            {activeTab === "compatibility" && (
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6">
                <div>
                  <h2 className="text-2xl font-black text-white flex items-center space-x-2">
                    <span>💞 雙人能量碰撞模擬器</span>
                  </h2>
                  <p className="text-xs sm:text-sm text-slate-400 mt-1">
                    輸入雙方 MBTI 與互動場景，即時解析契合指數、吵架降溫咒語與互補指南。
                  </p>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-400 mb-2">我方人格</label>
                    <select
                      value={compatSelf}
                      onChange={e => setCompatSelf(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500"
                    >
                      {Object.keys(ARCHETYPES).map(code => (
                        <option key={code} value={code}>{code} ({ARCHETYPES[code].title})</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-400 mb-2">對方人格</label>
                    <select
                      value={compatOther}
                      onChange={e => setCompatOther(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500"
                    >
                      {Object.keys(ARCHETYPES).map(code => (
                        <option key={code} value={code}>{code} ({ARCHETYPES[code].title})</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-400 mb-2">互動關係場景</label>
                    <select
                      value={compatRelation}
                      onChange={e => setCompatRelation(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500"
                    >
                      <option value="職場上下級">職場主管 / 部屬</option>
                      <option value="專案跨部門隊友">專案跨部門隊友</option>
                      <option value="戀愛伴侶">浪漫戀愛伴侶</option>
                      <option value="死黨閨蜜">多年摯友死黨</option>
                    </select>
                  </div>
                </div>

                <button
                  onClick={handleRunCompatibility}
                  disabled={compatLoading}
                  className="w-full py-3.5 bg-gradient-to-r from-pink-500 to-indigo-600 text-white font-bold rounded-2xl text-sm shadow-lg hover:opacity-95 transition"
                >
                  {compatLoading ? "正在進行靈魂能量碰撞演算法..." : "⚡ 開始合盤模擬"}
                </button>

                {compatResult && (
                  <div className="mt-6 p-6 bg-slate-950 rounded-2xl border border-slate-800 space-y-4">
                    <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                      <div>
                        <span className="text-xs text-indigo-400 font-bold block">化學反應</span>
                        <span className="text-lg font-bold text-white">{compatResult.chemistry_title}</span>
                      </div>
                      <div className="text-right">
                        <span className="text-xs text-slate-500 block">契合指數</span>
                        <span className="text-2xl font-black text-pink-400">{compatResult.synergy_score}%</span>
                      </div>
                    </div>
                    <p className="text-sm text-slate-300 leading-relaxed">{compatResult.core_dynamic}</p>
                    <div className="p-3 bg-rose-950/30 border border-rose-500/20 rounded-xl text-xs text-rose-200">
                      <span className="font-bold text-rose-400 block mb-1">💣 核心易爆地雷區：</span>
                      <ul className="list-disc list-inside space-y-1">
                        {compatResult.landmines && compatResult.landmines.map((m, i) => <li key={i}>{m}</li>)}
                      </ul>
                    </div>
                    <div className="p-3 bg-sky-950/30 border border-sky-500/20 rounded-xl text-xs text-sky-200">
                      <span className="font-bold text-sky-400 block mb-1">🧊 一秒降溫熄火咒語：</span>
                      <p className="italic">{compatResult.calming_spell}</p>
                    </div>
                  </div>
                )}
              </div>
            )}

            {activeTab === "roleplay" && (
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6">
                <div>
                  <h2 className="text-2xl font-black text-white flex items-center space-x-2">
                    <span>🎭 職場溝通模擬對話室</span>
                  </h2>
                  <p className="text-xs sm:text-sm text-slate-400 mt-1">
                    讓 Gemini 3.8 Flash 扮演特定性格主管或同事，測試你的說法是否能打動對方。
                  </p>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-400 mb-2">溝通對象原型</label>
                    <select
                      value={roleplayTarget}
                      onChange={e => setRoleplayTarget(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500"
                    >
                      <option value="ESTJ">ESTJ（雷厲風行的結果導向高管）</option>
                      <option value="INTP">INTP（凡事問因果的技術審查員）</option>
                      <option value="ESFP">ESFP（看重現場氛圍的公關同事）</option>
                      <option value="ISFJ">ISFJ（默默維護細節的後勤守護者）</option>
                      <option value="INTJ">INTJ（追求極致系統效率的架構師）</option>
                    </select>
                  </div>

                  <div className="sm:col-span-2">
                    <label className="block text-xs font-bold text-slate-400 mb-2">你打算對他說的一句話</label>
                    <input
                      type="text"
                      placeholder="例：主管，這個專案時程太趕了，我們可能需要砍掉兩個功能才能準時上線。"
                      value={roleplaySpeech}
                      onChange={e => setRoleplaySpeech(e.target.value)}
                      className="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 text-sm"
                    />
                  </div>
                </div>

                <button
                  onClick={handleRunRoleplay}
                  disabled={roleplayLoading || !roleplaySpeech.trim()}
                  className="w-full py-3.5 bg-gradient-to-r from-sky-500 to-indigo-600 text-white font-bold rounded-2xl text-sm shadow-lg hover:opacity-95 transition disabled:opacity-50"
                >
                  {roleplayLoading ? "對方正在審視你的措辭..." : "💬 發送對話並獲取反饋"}
                </button>

                {roleplayReply && (
                  <div className="mt-6 space-y-4">
                    <div className="p-4 bg-slate-950 rounded-2xl border border-slate-800">
                      <span className="text-xs text-sky-400 font-bold block mb-1">
                        👤 {roleplayTarget} 角色的直接回應：
                      </span>
                      <p className="text-sm text-white font-medium">{roleplayReply.in_character_reply}</p>
                    </div>
                    <div className="p-4 bg-slate-950 rounded-2xl border border-slate-800">
                      <span className="text-xs text-amber-400 font-bold block mb-1">
                        💭 對方未說出口的潛台詞（內心 OS）：
                      </span>
                      <p className="text-xs text-slate-400 italic">{roleplayReply.inner_thought}</p>
                    </div>
                    <div className="p-4 bg-indigo-950/40 rounded-2xl border border-indigo-500/30">
                      <span className="text-xs text-indigo-300 font-bold block mb-1">
                        💡 心理學情商（EQ）升級建議：
                      </span>
                      <p className="text-xs text-indigo-200">{roleplayReply.eq_coaching_advice}</p>
                    </div>
                  </div>
                )}
              </div>
            )}

            {activeTab === "history" && (
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6">
                <div className="flex items-center justify-between">
                  <div>
                    <h2 className="text-2xl font-black text-white">🕒 歷次測驗紀錄</h2>
                    <p className="text-xs sm:text-sm text-slate-400 mt-1">追蹤你在不同人生階段的心態與性格漂移</p>
                  </div>
                  <button
                    onClick={() => {
                      if (confirm("確定要清空所有歷史紀錄嗎？")) {
                        setTestHistory([]);
                        localStorage.removeItem("cognitype_history");
                      }
                    }}
                    className="text-xs text-slate-500 hover:text-rose-400 transition"
                  >
                    清空紀錄
                  </button>
                </div>

                {testHistory.length === 0 ? (
                  <div className="text-center py-12 text-slate-500 text-sm">
                    尚無測驗紀錄，快去完成一次 60 題深度評估吧！
                  </div>
                ) : (
                  <div className="space-y-3">
                    {testHistory.map((item, idx) => (
                      <div
                        key={item.id}
                        className="p-4 bg-slate-950 rounded-2xl border border-slate-800 flex items-center justify-between hover:border-slate-700 transition"
                      >
                        <div className="flex items-center space-x-3">
                          <span className="text-3xl">{item.avatar}</span>
                          <div>
                            <div className="flex items-center space-x-2">
                              <span className="text-base font-bold text-white">{item.type}</span>
                              <span className="text-xs text-sky-400 font-medium">{item.title}</span>
                              {idx === 0 && (
                                <span className="text-[10px] px-1.5 py-0.5 bg-emerald-500/20 text-emerald-300 rounded">最新</span>
                              )}
                            </div>
                            <span className="text-xs text-slate-500">{item.date}</span>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            <section className="mt-8 bg-slate-900/60 border border-slate-800/80 rounded-2xl p-4 sm:p-5 text-xs text-slate-400">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-3">
                <div className="flex items-center space-x-2">
                  <span className="font-bold text-slate-300">🔑 Gemini API 金鑰自動保存：</span>
                  {keySavedBadge && <span className="text-emerald-400 font-semibold animate-pulse">✓ 已自動存檔</span>}
                </div>

                <div className="flex items-center space-x-3 text-[11px]">
                  <span>當月使用量：<strong className="text-sky-400">{quotaState.count}</strong> / {quotaState.limit} 次</span>
                  {quotaState.isLocked ? (
                    <span className="px-2 py-0.5 bg-rose-500/20 text-rose-300 border border-rose-500/40 rounded font-bold">已熔斷鎖定</span>
                  ) : (
                    <span className="px-2 py-0.5 bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 rounded font-bold">安全運作中</span>
                  )}
                  <button onClick={handleResetQuota} className="text-slate-500 hover:text-slate-300 underline">重置</button>
                </div>
              </div>

              <input
                type="password"
                placeholder="貼上你的 Gemini API Key（離開後自動儲存於此瀏覽器，永不外洩）"
                value={apiKey}
                onChange={e => handleKeyChange(e.target.value)}
                className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-slate-200 placeholder-slate-600 focus:outline-none focus:border-indigo-500 font-mono text-xs"
              />
            </section>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
